<div class="card p-4 shadow-sm">

  <h2 class="mb-4">
    Add Property
  </h2>

  <form
    [formGroup]="propertyForm"
    (ngSubmit)="onSubmit()">

    <div class="mb-3">

      <label class="form-label">
        Property Name
      </label>

      <input
        type="text"
        class="form-control"
        formControlName="name">

      <small
        class="text-danger"
        *ngIf="
          propertyForm.controls.name.touched &&
          propertyForm.controls.name.invalid
        ">

        Name is required
        (minimum 3 characters)

      </small>

    </div>

    <div class="mb-3">

      <label class="form-label">
        Address
      </label>

      <input
        type="text"
        class="form-control"
        formControlName="address">

      <small
        class="text-danger"
        *ngIf="
          propertyForm.controls.address.touched &&
          propertyForm.controls.address.invalid
        ">

        Address is required

      </small>

    </div>

    <div class="mb-3">

      <label class="form-label">
        Monthly Rent
      </label>

      <input
        type="number"
        class="form-control"
        formControlName="monthlyRent">

      <small
        class="text-danger"
        *ngIf="
          propertyForm.controls.monthlyRent.touched &&
          propertyForm.controls.monthlyRent.invalid
        ">

        Rent must be greater than 0

      </small>

    </div>

    <div class="mb-3">

      <label class="form-label">
        Status
      </label>

      <select
        class="form-select"
        formControlName="status">

        <option value="">
          Select Status
        </option>

        <option
          *ngFor="let status of statuses"
          [value]="status">

          {{ status }}

        </option>

      </select>

      <small
        class="text-danger"
        *ngIf="
          propertyForm.controls.status.touched &&
          propertyForm.controls.status.invalid
        ">

        Status is required

      </small>

    </div>

    <div class="mb-3">

      <label class="form-label">
        Description
      </label>

      <textarea
        rows="3"
        class="form-control"
        formControlName="description">
      </textarea>

    </div>

    <button
      class="btn btn-dark"
      type="submit"
      [disabled]="propertyForm.invalid">

      Save Property

    </button>

    <p
      class="text-danger mt-3"
      *ngIf="errorMessage">

      {{ errorMessage }}

    </p>

  </form>

</div>
