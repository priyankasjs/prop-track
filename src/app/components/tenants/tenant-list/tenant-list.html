<div class="d-flex
justify-content-between
align-items-center
mb-4">

  <h2>Tenants</h2>

  <a
    routerLink="/tenants/add"
    class="btn btn-dark">

    Add Tenant

  </a>

</div>

<table class="table table-striped">

  <thead>

    <tr>

      <th>Name</th>

      <th>Contact</th>

      <th>Property ID</th>

      <th>Lease Start</th>

      <th>Lease End</th>

      <th>Actions</th>

    </tr>

  </thead>

  <tbody>

    <tr
      *ngFor="
        let tenant of tenants
      ">

      <td>
        {{ tenant.name }}
      </td>

      <td>
        {{ tenant.contact }}
      </td>

      <td>
        {{ tenant.propertyId }}
      </td>

      <td>
        {{ tenant.leaseStart }}
      </td>

      <td>
        {{ tenant.leaseEnd }}
      </td>

      <td>

        <div class="d-flex gap-2">

          <a
            [routerLink]="[
              '/tenants/edit',
              tenant.id
            ]"
            class="btn btn-warning btn-sm">

            Edit

          </a>

          <button
            class="btn btn-danger btn-sm"
            (click)="deleteTenant(tenant.id)">

            Delete

          </button>

        </div>

      </td>

    </tr>

  </tbody>

</table>
