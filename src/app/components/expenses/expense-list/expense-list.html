<div class="d-flex
justify-content-between
align-items-center
mb-4">

  <h2>Expenses</h2>

  <a
    routerLink="/expenses/add"
    class="btn btn-dark">

    Add Expense

  </a>

</div>

<div class="card p-4 shadow-sm mb-4">

  <h5>Total Expenses</h5>

  <h2 class="text-danger">
    ${{ totalExpenses }}
  </h2>

</div>

<div class="mb-4">

  <select
    class="form-select w-25"
    [(ngModel)]="selectedType"
    (change)="filterExpenses()">

    <option value="">
      All Expense Types
    </option>

    <option value="Maintenance">
      Maintenance
    </option>

    <option value="Repairs">
      Repairs
    </option>

    <option value="Renovation">
      Renovation
    </option>

  </select>

</div>

<table class="table table-striped">

  <thead>

    <tr>

      <th>Property ID</th>

      <th>Type</th>

      <th>Description</th>

      <th>Amount</th>

      <th>Date</th>

      <th>Actions</th>

    </tr>

  </thead>

  <tbody>

    <tr
      *ngFor="
        let expense of filteredExpenses
      ">

      <td>
        {{ expense.propertyId }}
      </td>

      <td>
        {{ expense.type }}
      </td>

      <td>
        {{ expense.description }}
      </td>

      <td>
        ${{ expense.amount }}
      </td>

      <td>
        {{ expense.date }}
      </td>

      <td>

        <div class="d-flex gap-2">

          <a
            [routerLink]="[
              '/expenses/edit',
              expense.id
            ]"
            class="btn btn-warning btn-sm">

            Edit

          </a>

          <button
            class="btn btn-danger btn-sm"
            (click)="deleteExpense(expense.id)">

            Delete

          </button>

        </div>

      </td>

    </tr>

  </tbody>

</table>
